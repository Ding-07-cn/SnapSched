name: Interface checks
on:
  push:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'samples/**'
      - 'evaluation/**'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'samples/**'
      - 'evaluation/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python test_extraction.py --selftest
      - run: python -m pip check
      - run: python -m compileall -q app.py ai_extraction.py extraction.py calendar_export.py runtime_config.py interface_state.py integrations.py review_page.py generate_calendar.py parser.py validator.py ics_generator.py import_validator.py exceptions.py tests scripts
